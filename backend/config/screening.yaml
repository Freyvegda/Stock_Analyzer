# Fundamental screening criteria. Edit and restart (or hit reload endpoint).
# A stock must pass ALL thresholds to be shortlisted.
criteria:
  pe_max: 25            # price/earnings ceiling
  pb_max: 5             # price/book ceiling
  roe_min: 15           # return on equity floor (%)
  roce_min: 15          # return on capital employed floor (%)
  debt_to_equity_max: 0.5
  market_cap_min: 1000  # crore, avoids illiquid smallcaps

shortlist_size: 10      # max stocks kept after ranking
